<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            font-family: 'Arial', sans-serif;
            color: white;
            overflow: hidden;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            max-width: 350px;
            text-align: center;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            animation: float 3s infinite ease-in-out;
            z-index: 100;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            margin: 0;
            font-size: 24px;
            background: linear-gradient(45deg, #ff6b6b, #ffd93d);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 15px;
        }

        .message {
            font-size: 16px;
            line-height: 1.6;
            margin: 20px 0;
            opacity: 0; /* Start with text hidden */
            animation: fadeIn 5s forwards; /* Slow fade-in effect */
        }

        @keyframes fadeIn {
            0% { opacity: 0; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .heart {
            color: #ff6b6b;
            font-size: 40px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        button {
            background: none;
            border: 2px solid #ff6b6b;
            color: #ff6b6b;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 15px;
            transition: all 0.3s;
        }

        button:hover {
            background: #ff6b6b;
            color: white;
        }

        .floating-heart {
            position: fixed;
            font-size: 24px;
            color: #ff6b6b;
            pointer-events: none;
            animation: floatUp 4s linear forwards;
            z-index: 1;
        }

        @keyframes floatUp {
            0% { 
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
                transform: translateY(90vh) scale(1);
            }
            100% { 
                transform: translateY(-20vh) scale(0);
                opacity: 0;
            }
        }

        .love-text {
            position: fixed;
            font-size: 80px;
            color: #ff6b6b;
            text-shadow: 0 0 10px rgba(255,107,107,0.5);
            pointer-events: none;
            opacity: 0;
            z-index: 1;
            font-weight: bold;
            text-align: center;
            width: 100%;
            transform: scale(0.5);
        }

        .love-text.show {
            animation: showLoveText 2s forwards;
        }

        @keyframes showLoveText {
            0% {
                opacity: 0;
                transform: scale(0.5);
            }
            50% {
                opacity: 1;
                transform: scale(1.2);
            }
            100% {
                opacity: 0;
                transform: scale(1);
            }
        }

        .background-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
    </style>
</head>
<body>
    <div class="background-hearts" id="backgroundHearts"></div>
    <div class="card">
        <h1>Happy Birthday, My Love!</h1>
        <div class="heart">❤️</div>
        <div class="message" id="message">
            To the one who makes my world brighter,
            Today is all about you - my boyfriend, my best friend, my favorite person.
            Thank you for filling my days with joy and my heart with love.
            You're the sweetest chapter in my story.
        </div>
        <button onclick="showLove()">Send Love</button>
    </div>

    <script>
        function showLove() {
            // Create love text
            // Create multiple hearts
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    createHeart();
                }, i * 100);
            }
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            heart.innerHTML = 'Love you❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.transform = `scale(${Math.random() * 0.5 + 0.5})`;
            document.getElementById('backgroundHearts').appendChild(heart);

            // Remove heart after animation
            setTimeout(() => {
                heart.remove();
            }, 4000);
        }

        // Create initial background animation
        function createBackgroundHeart() {
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.opacity = '0.1';
            heart.style.transform = `scale(${Math.random() * 0.3 + 0.2})`;
            document.getElementById('backgroundHearts').appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 4000);
        }

        // Create continuous background animation
        setInterval(() => {
            createBackgroundHeart();
        }, 2000);
    </script>
</body>
</html>
